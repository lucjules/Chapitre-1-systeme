<title>SQL R1.05</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#fbfcfe; --paper2:#f1f5fb; --grid:#d9e4f4; --margin:#e5484d;
  --ink:#16213a; --ink2:#46526c; --line:#cfd9ea;
  --accent:#1f4fd8; --accent-ink:#fff; --accent-soft:#e3ebff;
  --ok:#0e7a4b; --ok-soft:#dcf5e7; --ko:#b42318; --ko-soft:#fde8e6; --warn:#8a5a00; --warn-soft:#fff3d6;

  --r:10px; --side:270px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1424; --paper2:#131c31; --grid:#1b2845; --margin:#ff6b70; --ink:#e7edfb; --ink2:#a4b1cf; --line:#26344f;
  --accent:#7aa2ff; --accent-ink:#0b1226; --accent-soft:#17264d;
  --ok:#5fd6a0; --ok-soft:#10301f; --ko:#ff8f85; --ko-soft:#3a1714; --warn:#f2c36b; --warn-soft:#33270b;
  --slate:#070b15; --slate2:#0c1324;}}
:root[data-theme="dark"]{
  --paper:#0d1424; --paper2:#131c31; --grid:#1b2845; --margin:#ff6b70; --ink:#e7edfb; --ink2:#a4b1cf; --line:#26344f;
  --accent:#7aa2ff; --accent-ink:#0b1226; --accent-soft:#17264d;
  --ok:#5fd6a0; --ok-soft:#10301f; --ko:#ff8f85; --ko-soft:#3a1714; --warn:#f2c36b; --warn-soft:#33270b;
  --slate:#070b15; --slate2:#0c1324;}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--f-body);overflow-x:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
body.drawer-open{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700}
h2{font-size:1.7rem;margin-top:2.2em}
h3{font-size:1.25rem;margin-top:1.8em}
h4{font-size:1.02rem}
p{margin:.7em 0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);padding:.1em .38em;border-radius:5px}
pre{font-family:var(--f-mono);margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.5em 1em;z-index:100}
.skip:focus{left:8px;top:8px}
.muted{color:var(--ink2)}
[hidden]{display:none!important}

/* Barre du haut */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:var(--paper);border-bottom:2px solid var(--ink)}
.brand{font:700 1.35rem var(--f-head);text-decoration:none;color:var(--ink);white-space:nowrap}
.brand-mark{background:var(--accent);color:var(--accent-ink);padding:.05em .3em;border-radius:6px;margin-right:2px}
.brand small{font:400 .75rem var(--f-body);color:var(--ink2);margin-left:6px}
.meter{flex:1;max-width:240px;height:8px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden;margin-left:auto}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.prog-txt{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.3em .8em;cursor:pointer;font-weight:700;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.icon-btn{border:2px solid var(--ink);background:transparent;border-radius:8px;width:38px;height:36px;cursor:pointer;font-size:1.3rem;line-height:1}
#menu-btn{display:none}

/* Mise en page */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{padding:20px 16px 40px max(16px,env(safe-area-inset-left));border-right:2px solid var(--ink);background:var(--paper);position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.nav-h{font:700 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);margin:18px 0 6px}
.nav-g:first-child .nav-h{margin-top:0}
.nav a{display:flex;gap:10px;align-items:baseline;padding:.4em .6em;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.95rem;line-height:1.3}
.nav a:hover{background:var(--accent-soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav-n{font:700 .8rem var(--f-mono);min-width:1.8em;color:var(--accent)}
.nav a[aria-current="page"] .nav-n{color:var(--paper)}
.nav a.is-done .nav-t::after{content:" ✓";color:var(--ok);font-weight:700}
.nav a[aria-current="page"].is-done .nav-t::after{color:var(--ok-soft)}
.scrim{display:none}
main{padding:32px max(16px,env(safe-area-inset-right)) 80px 56px;position:relative;outline:none;min-width:0}
main::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.page,.home{max-width:820px}
.page.wide{max-width:960px}
.kicker{font:700 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--margin);margin:0 0 .5em}
.lead{font-size:1.15rem;color:var(--ink2);max-width:62ch}
.body>:first-child{margin-top:1em}

/* Accueil */
.hero{padding:10px 0 20px}
.hero h1{max-width:18ch}
.home-sum{margin-top:22px;padding:16px 18px;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.sum-line{margin:0}
.skills{list-style:none;margin:16px 0;padding:0;display:grid;gap:10px}
.skill a{display:grid;grid-template-columns:2.2em 1fr;gap:2px 10px;align-items:baseline;text-decoration:none;color:var(--ink);padding:12px 14px;background:var(--paper);border:2px solid var(--line);border-radius:var(--r)}
.skill a:hover{border-color:var(--accent)}
.sk-n{grid-row:span 2;font:700 1.4rem var(--f-head);color:var(--accent)}
.sk-t{font-weight:700}
.sk-l{font-size:.85rem;color:var(--ink2)}
.skill.is-done a{border-color:var(--ok);background:var(--ok-soft)}
.skill.is-done .sk-n::after{content:"✓";font-size:.9rem;margin-left:2px;color:var(--ok)}

/* Boutons */
.btn{display:inline-block;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:.5em 1em;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.mini{padding:.28em .65em;font-size:.82rem;box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Anatomie */
.anatomy{margin:1.4em 0;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:18px 20px;background:var(--slate);color:var(--slate-ink);border-radius:var(--r);max-width:620px}
.an-code{font:600 1.25rem/1.7 var(--f-mono)}
.an-nom,.an-type,.an-val{padding:.05em .3em;border-radius:5px;border-bottom:3px solid}
.an-nom{border-color:#ff9db1;background:#ff9db11f}.an-type{border-color:#7fe0c3;background:#7fe0c31f}.an-val{border-color:#f6c177;background:#f6c1771f}
.an-legend{list-style:none;margin:0;padding:0;font-size:.95rem}
.an-legend li{margin:.25em 0}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.5em;vertical-align:-.05em}
.dot.nom{background:#ff9db1}.dot.type{background:#7fe0c3}.dot.val{background:#f6c177}
.hero-fig{margin-top:.6em}

/* Notes */
.note{margin:1.4em 0;border:2px solid var(--ink);border-left-width:8px;border-radius:var(--r);background:var(--paper)}
.note-h{font:700 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;padding:10px 14px 0}
.note-b{padding:2px 14px 12px}
.note-b>:first-child{margin-top:.3em}.note-b>:last-child{margin-bottom:0}
.note.convention{border-left-color:var(--accent)}.note.convention .note-h{color:var(--accent)}
.note.attention{border-left-color:var(--margin)}.note.attention .note-h{color:var(--margin)}
.note.retenir{border-left-color:var(--ok)}.note.retenir .note-h{color:var(--ok)}

/* Tables */
.tbl-wrap,.trace-wrap{overflow-x:auto;margin:1em 0;max-width:100%}
table{border-collapse:collapse;background:var(--paper);min-width:260px}
.tbl th,.tbl td,.trace th,.trace td,.memo th,.memo td{border:1.5px solid var(--ink);padding:.4em .8em;text-align:left;vertical-align:top}
.tbl th,.trace th,.memo thead th{background:var(--accent-soft);font:700 .85rem var(--f-body)}
.bv{font-weight:700;padding:.05em .5em;border-radius:99px;font-size:.88em}
.bv.t{background:var(--ok-soft);color:var(--ok)}.bv.f{background:var(--ko-soft);color:var(--ko)}
.truth{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.triple-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:1em 0}
.mini-card{padding:12px;border:2px solid var(--line);border-radius:var(--r);background:var(--paper)}
.mini-card .cb{margin:.5em 0}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:1em 0}
.lvl{border:2px solid var(--ink);border-radius:var(--r);padding:12px;background:var(--paper)}
.lvl p{margin:.2em 0;font-size:.9rem}
.shape{background:var(--slate);color:var(--slate-ink);padding:.6em .9em;border-radius:8px;margin:.5em 0;line-height:1.2;overflow-x:auto}
.surf{font-size:.9rem}
.flow{counter-reset:f;list-style:none;padding:0;margin:1em 0}
.flow li{counter-increment:f;position:relative;padding:.2em 0 .9em 3em}
.flow li::before{content:counter(f);position:absolute;left:0;top:0;width:2em;height:2em;border-radius:50%;background:var(--ink);color:var(--paper);font:700 .95rem/2em var(--f-head);text-align:center}
.calltree,.calltree ul{list-style:none;margin:0;padding-left:1.3em;border-left:2px solid var(--line)}
.calltree{border:0;padding:0;margin:1em 0}
.calltree li{padding:.15em 0}
.pistes{margin:1.4em 0;border:2px dashed var(--ink2);border-radius:var(--r);padding:10px 14px;background:var(--paper)}
.pistes summary{cursor:pointer;font-weight:700}
.memo{width:100%}
.memo th[scope="row"]{background:var(--paper2);font-weight:700;white-space:nowrap}
.memo pre{white-space:pre;font-size:.82rem;color:var(--slate-ink);background:var(--slate);padding:.5em .7em;border-radius:6px}
.pieges{list-style:none;padding:0;display:grid;gap:10px}
.pieges li{padding:10px 14px;border-left:6px solid var(--margin);background:var(--paper);border-radius:0 var(--r) var(--r) 0;border:2px solid var(--line);border-left:6px solid var(--margin)}
.pieges strong{display:block}

/* Code */
.cb{margin:1.2em 0;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--slate)}
.cb-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--slate2);border-bottom:1px solid #ffffff1c}
.cb-lang{font:700 .75rem var(--f-mono);color:var(--slate-mute);text-transform:uppercase;letter-spacing:.08em}
.cb-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;color:var(--slate-mute);padding:.3em .7em;border-radius:6px;cursor:pointer;font:700 .82rem var(--f-mono)}
.tab[aria-selected="true"]{background:#ffffff1f;color:#fff}
.cb .btn{box-shadow:none;border-color:#ffffff55}
.cb .btn.ghost{background:transparent;color:var(--slate-ink)}
.cb-code,.ex-code,.prog,.house-out,.afl-out{margin:0;padding:14px 16px;color:var(--slate-ink);background:var(--slate);overflow-x:auto;font-size:.88rem;line-height:1.65;tab-size:4}
.numbered .ln,.prog .ln{display:block;padding-left:3em;position:relative;min-height:1.65em}
.cb-code.numbered .ln::before,.numbered .ln::before,.prog .ln::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:2em;text-align:right;color:var(--slate-mute)}
.cb.numbered .cb-code,.prog{counter-reset:ln}
.ln.active{background:#7aa2ff33;box-shadow:inset 3px 0 0 var(--k)}
.c-kw{color:var(--k);font-weight:600}.c-type{color:var(--t)}.c-str{color:var(--s)}.c-num{color:var(--n)}.c-com{color:var(--cm);font-style:italic}.c-fn,.c-bi{color:var(--f)}.c-op{color:#ffb0a0}
.cb-term{border-top:1px solid #ffffff1c}
.ex-code{border-radius:8px;margin:.6em 0}
.memo .c-kw{color:var(--k)}

/* Terminal */
.term{background:var(--slate);color:var(--slate-ink);font:.88rem/1.55 var(--f-mono)}
.term-out{min-height:3.2em;max-height:340px;overflow:auto;padding:12px 16px;white-space:pre-wrap;word-break:break-word}
.t-echo{color:var(--s)}.t-err{color:#ff9d93}
.term-in{display:flex;gap:8px;align-items:center;padding:6px 14px;border-top:1px solid #ffffff1c}
.term-in .prompt{color:var(--t)}
.term-input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--slate-mute);color:#fff;font:inherit;padding:.3em 0;outline:none}
.term-input:focus{border-bottom-color:var(--t)}
.term-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid #ffffff1c;min-height:34px}
.term-status{font-size:.78rem;color:var(--slate-mute)}.term-status.ok{color:#7fe0c3}.term-status.err{color:#ff9d93}.term-status.wait{color:var(--s)}
#at-term{border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;margin:12px 0}

/* Éditeur */
.editor{display:grid;grid-template-columns:auto 1fr;background:var(--slate);border:2px solid var(--ink);border-radius:var(--r) var(--r) 0 0;overflow:hidden;margin-top:.8em}
.gutter{padding:12px 8px 12px 12px;text-align:right;color:var(--slate-mute);font:.88rem/1.65 var(--f-mono);overflow:hidden;user-select:none;background:var(--slate2)}
.gutter span{display:block}.gutter span.err{background:var(--ko);color:#fff;border-radius:3px}
.ta{width:100%;resize:none;border:0;background:var(--slate);color:var(--slate-ink);font:.88rem/1.65 var(--f-mono);padding:12px 14px;white-space:pre;overflow:auto;outline:none;tab-size:4}
.editor:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.ed-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--paper2);border:2px solid var(--ink);border-top:0;border-radius:0 0 var(--r) var(--r)}
.ed-hint{font-size:.8rem;color:var(--ink2);margin-left:auto}
.at-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:1.2em 0 .4em}
.at-bar select{font:inherit;padding:.4em .6em;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.at-trace{margin-top:12px}

/* Exercices */
.practice{margin-top:2.5em}
.ex{margin:1.4em 0;padding:16px 18px;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink)}
.ex.is-done{border-color:var(--ok);box-shadow:5px 5px 0 var(--ok)}
.ex-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.ex-kind{font:700 .74rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.ex-badge{font-weight:700;font-size:.82rem;color:var(--ok)}
.ex-title{margin:.1em 0}
.ex-q{margin:.4em 0 .8em;font-weight:700}
.big{font-size:1.2rem;padding:.2em .6em}
.choices,.bool-btns{display:grid;gap:8px}
.bool-btns{grid-template-columns:1fr 1fr;max-width:320px}
.choice{display:flex;gap:10px;align-items:center;text-align:left;padding:.6em .8em;border:2px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .mark{flex:none;width:1.1em;height:1.1em;border:2px solid var(--ink2);border-radius:50%}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}.choice.ok .mark{background:var(--ok);border-color:var(--ok)}
.choice.ko{border-color:var(--ko);background:var(--ko-soft)}.choice.ko .mark{background:var(--ko);border-color:var(--ko)}
.choice.ok .mark::after{content:"✓";color:#fff;font-size:.7em;display:block;text-align:center;line-height:1.3}
.choice.ko .mark::after{content:"×";color:#fff;font-size:.9em;display:block;text-align:center;line-height:1.1}
.val-form{display:flex;gap:8px;flex-wrap:wrap}
.val-input,.ev-input,.afl-form input,.house-form input[type=text],.house-form input:not([type]){font:1rem var(--f-mono);padding:.45em .7em;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
.val-input{flex:1;max-width:260px}
.ex-fb{margin:.8em 0 0;font-weight:700;min-height:1.2em;white-space:pre-wrap}
.ex-fb.ok{color:var(--ok)}.ex-fb.ko{color:var(--ko)}
.ex-actions{display:flex;flex-wrap:wrap;gap:8px;margin:.9em 0}
.tests-out{display:grid;gap:6px;margin-top:6px}
.hint{padding:10px 14px;background:var(--warn-soft);color:var(--ink);border-left:6px solid var(--warn);border-radius:0 8px 8px 0}
.sol{margin-top:10px}
.res-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.res-sum{font-weight:700}.res-err{color:var(--ko);font-weight:700}
.res-detail{white-space:pre-wrap;font:.82rem var(--f-mono);margin:.2em 0 0;color:var(--ink2)}
.res-mark{font-weight:700;margin-right:.4em}
.trace-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.trace-layout .prog{border-radius:8px}
.trace input{width:100%;min-width:3.5em;font:.95rem var(--f-mono);padding:.3em .4em;border:1.5px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
.trace td:has(input){padding:3px}
.trace td.ok input,.trace input.ok{border-color:var(--ok);background:var(--ok-soft)}
.trace td.ko input,.trace input.ko{border-color:var(--ko);background:var(--ko-soft)}
.trace tr.cur td{background:var(--accent-soft);font-weight:700}
.trace td{font-family:var(--f-mono)}
.trace-sol{margin-top:10px}

/* Widgets */

<script>
/* util.js */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const Store = {
  key: 'sql-r105-v1',
  data: { done: {}, lessons: {}, atelier: '', notes: {} },
  load() { try { const s = localStorage.getItem(this.key); if (s) Object.assign(this.data, JSON.parse(s)); } catch (e) { /* indisponible */ } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* indisponible */ } }
};
const note = (kind, title, html) => `<aside class="note ${kind}"><div class="note-h">${title}</div><div class="note-b">${html}</div></aside>`;
if (typeof module !== 'undefined') module.exports = { esc, note };

/* engine.js */
/* Mini-moteur SQL (sous-ensemble de T-SQL) : SELECT [DISTINCT] [TOP n] ... FROM ... [INNER JOIN ... ON ...] [WHERE ...] [ORDER BY ...] */
const SQLE = (() => {
  class F { constructor(v) { this.v = v; } }
  const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  class SqlError extends Error {}
  const KW = new Set(['select', 'distinct', 'top', 'from', 'where', 'order', 'by', 'asc', 'desc', 'inner', 'join', 'on', 'and', 'or', 'not', 'like', 'is', 'null', 'between', 'in', 'as', 'cross', 'left', 'right', 'group', 'having']);

  function tokenize(src) {
    const t = []; let i = 0;
    while (i < src.length) {
      const ch = src[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (src.startsWith('--', i)) { while (i < src.length && src[i] !== '\n') i++; continue; }
      if (src.startsWith('/*', i)) { const e = src.indexOf('*/', i + 2); i = e < 0 ? src.length : e + 2; continue; }
      if (ch === "'") {
        let s = ''; i++;
        for (;;) {
          if (i >= src.length) throw new SqlError("Chaîne de caractères non terminée : il manque une apostrophe fermante (').");
          if (src[i] === "'") { if (src[i + 1] === "'") { s += "'"; i += 2; continue; } i++; break; }
          s += src[i++];
        }
        t.push({ k: 'str', v: s }); continue;
      }
      if (ch === '"' || ch === '[') {
        const close = ch === '[' ? ']' : '"'; const e = src.indexOf(close, i + 1);
        if (e < 0) throw new SqlError('Identifiant non terminé.');
        t.push({ k: 'id', v: src.slice(i + 1, e) }); i = e + 1; continue;
      }
      if (/[0-9]/.test(ch)) {
        const m = /^[0-9]+(\.[0-9]+)?/.exec(src.slice(i));
        t.push({ k: 'num', v: m[1] ? new F(parseFloat(m[0])) : parseInt(m[0], 10) }); i += m[0].length; continue;
      }
      if (/[A-Za-zÀ-ÿ_@#]/.test(ch)) {
        const m = /^[A-Za-zÀ-ÿ_@#][A-Za-zÀ-ÿ0-9_@#$]*/.exec(src.slice(i));
        const low = norm(m[0]);
        t.push(KW.has(low) ? { k: 'kw', v: low } : { k: 'id', v: m[0], bare: true }); i += m[0].length; continue;
      }
      const two = src.slice(i, i + 2);
      if (['<=', '>=', '<>', '!='].includes(two)) { t.push({ k: 'op', v: two === '!=' ? '<>' : two }); i += 2; continue; }
      if ('=<>+-*/%(),.;'.includes(ch)) { t.push({ k: 'op', v: ch }); i++; continue; }
      throw new SqlError(`Caractère inattendu : « ${ch} ».`);
    }
    return t;
  }

  function parse(src) {
    const t = tokenize(src); let p = 0;
    const peek = () => t[p], next = () => t[p++];
    const isKw = v => t[p] && t[p].k === 'kw' && t[p].v === v;
    const isOp = v => t[p] && t[p].k === 'op' && t[p].v === v;
    const eatKw = v => isKw(v) ? (p++, true) : false;
    const eatOp = v => isOp(v) ? (p++, true) : false;
    const where = () => { const x = t[p]; return x ? `près de « ${x.k === 'str' ? "'" + x.v + "'" : x.k === 'num' ? (x.v instanceof F ? x.v.v : x.v) : x.v} »` : 'à la fin de la requête'; };
    const need = (v, what) => { if (!eatKw(v)) throw new SqlError(`Syntaxe incorrecte ${where()} : ${what || 'il manque ' + v.toUpperCase()}.`); };

    function primary() {
      const x = peek();
      if (!x) throw new SqlError('Syntaxe incorrecte : l\'expression est incomplète.');
      if (x.k === 'num') { p++; return { t: 'lit', v: x.v }; }
      if (x.k === 'str') { p++; return { t: 'lit', v: x.v }; }
      if (x.k === 'kw' && x.v === 'null') { p++; return { t: 'lit', v: null }; }
      if (isOp('(')) { p++; const e = expr(); if (!eatOp(')')) throw new SqlError('Il manque une parenthèse fermante « ) ».'); return e; }
      if (isOp('-')) { p++; return { t: 'neg', e: primary() }; }
      if (isOp('+')) { p++; return primary(); }
      if (x.k === 'id') {
        p++;
        if (isOp('(')) {
          p++; const args = [];
          if (!isOp(')')) { do { args.push(expr()); } while (eatOp(',')); }
          if (!eatOp(')')) throw new SqlError('Il manque une parenthèse fermante « ) ».');
          return { t: 'fn', n: norm(x.v), args };
        }
        if (isOp('.')) { p++; const y = next(); if (!y || y.k !== 'id') throw new SqlError('Nom de colonne attendu après le point.'); return { t: 'col', tbl: x.v, n: y.v }; }
        return { t: 'col', n: x.v };
      }
      throw new SqlError(`Syntaxe incorrecte ${where()}.`);
    }
    function mul() { let l = primary(); while (isOp('*') || isOp('/') || isOp('%')) { const o = next().v; l = { t: 'bin', o, l, r: primary() }; } return l; }
    function add() { let l = mul(); while (isOp('+') || isOp('-')) { const o = next().v; l = { t: 'bin', o, l, r: mul() }; } return l; }
    function cmp() {
      const l = add();
      if (t[p] && t[p].k === 'op' && ['=', '<>', '<', '>', '<=', '>='].includes(t[p].v)) { const o = next().v; return { t: 'cmp', o, l, r: add() }; }
      let neg = false; const save = p;
      if (isKw('not')) { p++; neg = true; }
      if (eatKw('like')) { return { t: 'like', neg, l, r: add() }; }
      if (eatKw('between')) { const a = add(); need('and', 'BETWEEN a AND b'); const b = add(); return { t: 'between', neg, l, a, b }; }
      if (eatKw('in')) {
        if (!eatOp('(')) throw new SqlError('IN doit être suivi d\'une liste entre parenthèses.');
        const list = []; do { list.push(add()); } while (eatOp(','));
        if (!eatOp(')')) throw new SqlError('Il manque une parenthèse fermante « ) ».');
        return { t: 'in', neg, l, list };
      }
      if (neg) p = save;
      if (eatKw('is')) { const n = eatKw('not'); need('null', 'IS [NOT] NULL'); return { t: 'isnull', neg: n, l }; }
      return l;
    }
    function not() { if (eatKw('not')) return { t: 'not', e: not() }; return cmp(); }
    function and() { let l = not(); while (eatKw('and')) l = { t: 'and', l, r: not() }; return l; }
    function expr() { let l = and(); while (eatKw('or')) l = { t: 'or', l, r: and() }; return l; }

    if (!isKw('select')) throw new SqlError('Cette version ne comprend que des requêtes SELECT : la requête doit commencer par SELECT.');
    p++;
    const q = { distinct: false, top: null, items: [], from: null, joins: [], where: null, order: [] };
    if (eatKw('distinct')) q.distinct = true;
    if (eatKw('top')) { const n = next(); if (!n || n.k !== 'num') throw new SqlError('TOP doit être suivi d\'un nombre.'); q.top = n.v; }
    do {
      if (isOp('*')) { p++; q.items.push({ star: true }); continue; }
      if (t[p] && t[p].k === 'id' && t[p + 1] && t[p + 1].v === '.' && t[p + 2] && t[p + 2].v === '*') { q.items.push({ star: true, tbl: t[p].v }); p += 3; continue; }
      const e = expr(); let alias = null;
      if (eatKw('as')) { const a = next(); if (!a || (a.k !== 'id' && a.k !== 'str')) throw new SqlError('Nom attendu après AS.'); alias = a.v; }
      else if (t[p] && t[p].k === 'id') alias = next().v;
      q.items.push({ e, alias });
    } while (eatOp(','));
    if (eatKw('from')) {
      const tbl = () => { const n = next(); if (!n || n.k !== 'id') throw new SqlError(`Nom de table attendu ${where()}.`); let a = null; if (eatKw('as')) a = next().v; else if (t[p] && t[p].k === 'id') a = next().v; return { name: n.v, alias: a || n.v }; };
      q.from = tbl();
      for (;;) {
        if (eatOp(',')) { q.joins.push({ ...tbl(), on: null }); continue; }
        if (isKw('inner') || isKw('join') || isKw('cross')) {
          const cross = isKw('cross'); if (!isKw('join')) p++; need('join', 'JOIN attendu');
          const tb = tbl(); let on = null;
          if (!cross) { need('on', 'une jointure INNER JOIN doit avoir une condition ON'); on = expr(); }
          q.joins.push({ ...tb, on }); continue;
        }
        break;
      }
    } else if (t[p] && t[p].k === 'id' && !t[p].bare === false && t[p + 1] === undefined) {
      /* ex. SELECT nom prénom : géré plus bas */
    }
    if (eatKw('where')) q.where = expr();
    if (isKw('group') || isKw('having')) throw new SqlError('GROUP BY et HAVING ne sont pas encore au programme de cette séquence.');
    if (eatKw('order')) { need('by', 'ORDER doit être suivi de BY'); do { const e = expr(); let d = false; if (eatKw('desc')) d = true; else eatKw('asc'); q.order.push({ e, d }); } while (eatOp(',')); }
    eatOp(';');
    if (p < t.length) {
      const h = (t[p].k === 'id' && q.items.length) ? ' Astuce : les attributs sont séparés par des virgules, et l\'ordre des clauses est SELECT, FROM, WHERE, ORDER BY.' : '';
      throw new SqlError(`Syntaxe incorrecte ${where()}.${h}`);
    }
    return q;
  }

  /* ---------- évaluation ---------- */
  const isF = x => x instanceof F, nv = x => isF(x) ? x.v : x;
  const isDateStr = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}/.test(s);
  function cmpVals(a, b) {
    if (typeof a === 'string' && typeof b === 'string') { const x = norm(a), y = norm(b); return x < y ? -1 : x > y ? 1 : 0; }
    if (typeof a === 'string' || typeof b === 'string') {
      const n = typeof a === 'string' ? a : b;
      if (!isNaN(parseFloat(n)) && isFinite(n)) { const x = parseFloat(nv(a)), y = parseFloat(nv(b)); return x < y ? -1 : x > y ? 1 : 0; }
      throw new SqlError(`Impossible de comparer du texte et un nombre (« ${n} »).`);
    }

<ul><li><strong>Indépendance physique</strong> : modifier la structure physique sans toucher à la structure logique.</li><li><strong>Indépendance logique</strong> : modifier le schéma conceptuel sans altérer les vues, ou créer de nouvelles vues sans modifier le schéma conceptuel.</li></ul>

    body: () => `
<h2>Quelques bases mathématiques</h2>
<p>Un <strong>ensemble</strong> est une collection d'objets distincts. On le décrit <em>en extension</em> (par la liste de ses éléments, <code>A = {a, b, c}</code>) ou <em>en compréhension</em> (par une propriété, <code>P = { x ∈ ℕ / x est pair }</code>).</p>
<p>Le <strong>produit cartésien</strong> A × B est l'ensemble des couples (a, b) avec a ∈ A et b ∈ B :</p>
<p class="math">{ Chloé, Luc, Zoé } × {1, 2} = { (Chloé,1), (Chloé,2), (Luc,1), (Luc,2), (Zoé,1), (Zoé,2) }</p>
<p>Une <strong>relation</strong> R entre A et B est un sous-ensemble de leur produit cartésien : <code>nombreDeVéhicules = { (Chloé,2), (Luc,1) }</code>. Cela s'étend à plus de deux ensembles.</p>
<h2>Le lien avec les bases de données</h2>
<p>La table ci-dessous est un sous-ensemble de CH × CH × ℕ (chaînes × chaînes × entiers) : c'est une relation.</p>
<div class="tbl-wrap"><table class="tbl"><caption>ArtistePeintre</caption><thead><tr><th>nom</th><th>prénom</th><th>nationalité</th></tr></thead><tbody><tr><td>de Vinci</td><td>Léonard</td><td>3</td></tr><tr><td>Kahlo</td><td>Frida</td><td>1</td></tr><tr><td>Claudel</td><td>Camille</td><td>2</td></tr></tbody></table></div>
<h2>Le vocabulaire</h2>
${tbl(['Terme', 'Synonyme', 'Définition', 'Exemple'], [
  ['<strong>domaine</strong>', 'type', 'ensemble des valeurs possibles d\'un composant (entier, flottant, date, chaîne…). Le nombre de domaines est le <em>degré</em> (ou arité).', 'chaîne de caractères'],
  ['<strong>attribut</strong>', 'colonne', 'un composant d\'une relation, caractérisé par son nom et son domaine', c('prénom')],
  ['<strong>schéma de relation</strong>', 'structure de table', 'le nom de la relation + la liste de ses attributs et domaines : une description abstraite', c('ArtistePeintre (nom : chaîne, prénom : chaîne, nationalité : entier)')],
  ['<strong>relation</strong>', 'table', 'une instance d\'un schéma de relation : le schéma reste stable, le contenu évolue', 'la table ci-dessus'],

  ['<strong>base de données relationnelle</strong>', '', 'un ensemble de relations satisfaisant le schéma relationnel', 'les deux tables remplies']])}
${note('retenir', 'À retenir', '<p>Attribut = titre de colonne. Tuple = ligne. Le <strong>schéma</strong> est la description, la <strong>relation</strong> est son contenu à un instant donné.</p>')}`

    body: () => `
<h2>La clé primaire</h2>
${note('retenir', 'Définition', '<p>La <strong>clé primaire</strong> (ou clé) d\'une relation est un ensemble <strong>minimal</strong> d\'attributs dont la connaissance permet d\'identifier de manière <strong>unique</strong> chaque tuple. Toute relation doit posséder une clé (soulignée par convention).</p>')}
<p>Dans <code>ArtistePeintre (nom, prénom, nationalité)</code>, que se passe-t-il si deux artistes ont le même nom ? <code>nom</code> ne peut pas être la clé. <code>{nom, prénom}</code> non plus, ni même <code>{nom, prénom, nationalité}</code>. On crée donc une clé « artificielle » :</p>
<p class="schema-line"><code>ArtistePeintre (<u>numArtiste</u> : entier, nom : chaîne, prénom : chaîne, nationalité : entier)</code><br><code>Pays (<u>numéroPays</u> : entier, nomPays : chaîne, capitale : chaîne)</code></p>
<h2>La clé étrangère</h2>
<p>L'attribut <code>nationalité</code> permet de retrouver la ligne correspondante dans <code>Pays</code> : c'est une <strong>clé étrangère</strong> (clé primaire d'une autre table).</p>
<div class="two-tbl">
<div class="tbl-wrap"><table class="tbl"><caption>ArtistePeintre</caption><thead><tr><th><u>numArtiste</u></th><th>nom</th><th>prénom</th><th>nationalité</th></tr></thead><tbody><tr><td>1</td><td>de Vinci</td><td>Léonard</td><td>3</td></tr><tr><td>2</td><td>Kahlo</td><td>Frida</td><td>1</td></tr><tr><td>3</td><td>Claudel</td><td>Camille</td><td>2</td></tr></tbody></table></div>
<div class="tbl-wrap"><table class="tbl"><caption>Pays</caption><thead><tr><th><u>numéroPays</u></th><th>nomPays</th><th>capitale</th></tr></thead><tbody><tr><td>1</td><td>Mexique</td><td>Mexico</td></tr><tr><td>2</td><td>France</td><td>Paris</td></tr><tr><td>3</td><td>Italie</td><td>Rome</td></tr></tbody></table></div></div>
<p>Si une ligne d'<code>ArtistePeintre</code> contient une nationalité qui ne correspond à aucun pays, la base est <strong>incohérente</strong> (non intègre).</p>
<h2>Les contraintes d'intégrité</h2>
<p>Une <strong>contrainte d'intégrité</strong> est un prédicat qui doit être satisfait pour que la base soit considérée comme cohérente. Elle fait partie du schéma relationnel. Attention : le SGBD ne peut pas savoir que le prénom de Monet n'est pas Albert (erreur de saisie ≠ incohérence).</p>
${tbl(['Contrainte', 'Ce qu\'elle impose', 'Notation'], [
  ['<strong>référence</strong>', 'toute valeur d\'une clé étrangère doit exister comme clé primaire dans l\'autre table. Le SGBD interdit de créer une telle ligne, et de supprimer un pays tant que des artistes y font référence.', c('ArtistePeintre.nationalité référence Pays.numéroPays')],
  ['<strong>attribut obligatoire</strong>', 'l\'attribut doit toujours être renseigné (la « * » des formulaires)', c('Tous les attributs, excepté ArtistePeintre.prénom, sont obligatoires')],
  ['<strong>unicité</strong>', 'deux lignes distinctes ne peuvent avoir la même valeur pour un attribut (ou un groupe d\'attributs)', c('Unicité de Pays.nomPays')]])}
<p>Ces trois contraintes sont gérées par le SGBD lui-même. Les autres (contraintes « contextuelles ») sont à la charge des développeurs, qui doivent les vérifier avant tout ajout ou modification.</p>
<h2>Les schémas des TD en un coup d'œil</h2>
<p>Voici les tables utilisées dans la suite du cours (🔑 clé primaire, → clé étrangère) :</p>
${schemaFig(['Pays', 'Auteur', 'Livre', 'Ecrire'])}
<ul class="refs">${REFS.map(r => `<li><code>${esc(r)}</code></li>`).join('')}</ul>

<p>Pour chaque situation, propose un schéma relationnel (schéma des relations et contraintes d'intégrité) dans les exercices en bas de page, puis compare avec la correction proposée.</p>`

    body: () => `
<h2>Le langage SQL</h2>
<p>SEQUEL (inspiré par Codd, 1970) devient <strong>SQL</strong> en 1975. Première version commerciale en 1979 (Oracle), norme ANSI en 1986, ISO en 1987. SQL couvre quatre domaines : <strong>définition</strong> des données (structure), <strong>manipulation</strong> (interrogation et mise à jour), <strong>contrôle</strong> des données (droits d'accès) et contrôle des <strong>transactions</strong>.</p>
<h2>Une seule instruction : SELECT</h2>
${anatomy()}
<p>Un commentaire commence par <code>--</code>. La casse n'a pas d'importance : <code>SELECT</code>, <code>select</code> et <code>SelECt</code> sont équivalents.</p>
<h2>Notre base de travail</h2>
<p>Les exemples utilisent la mini-base Bibliothèque. Tu peux exécuter chaque requête avec le bouton ▶.</p>
${schemaFig(['Pays', 'Auteur', 'Livre', 'Ecrire'])}
<h2>La projection</h2>
<p>La <strong>projection</strong> conserve seulement certains attributs d'une table. Exemple : nom et prénom des auteurs.</p>
${sqlb('SELECT nom, prénom\nFROM Auteur')}
<p>Format général : <code>SELECT &lt;liste d'attributs séparés par des virgules&gt; FROM &lt;nom de la table&gt;</code>. Pour obtenir <strong>tous</strong> les attributs : <code>SELECT *</code>.</p>
${sqlb('SELECT *\nFROM Pays')}
<h3>Trier le résultat</h3>
<p>Par ordre croissant des noms et, pour les auteurs de même nom, par ordre décroissant des prénoms :</p>
${sqlb('SELECT nom, prénom\nFROM Auteur\nORDER BY nom ASC, prénom DESC')}
<p>Les critères de tri sont séparés par des virgules, du plus important au moins important. <code>ASC</code> (croissant) est le choix par défaut.</p>
<h3>Et les doublons ?</h3>
<p>Un résultat peut contenir des doublons (auteurs homonymes, prénoms identiques…). Pour n'avoir jamais deux lignes identiques, on ajoute <code>DISTINCT</code>.</p>
${sqlb('SELECT prénom\nFROM Auteur')}
${sqlb('SELECT DISTINCT prénom\nFROM Auteur')}
${note('attention', 'Piège', `<p>Dans <code>SELECT nom prénom FROM Auteur</code>, il manque la virgule : SQL comprend que <code>prénom</code> est un <em>nom donné à la colonne</em> <code>nom</code> (alias). Le résultat n'a qu'une colonne ! Essaie :</p>${sqlb('SELECT nom prénom\nFROM Auteur')}`)}
<h2>Avec l'atelier</h2>
<p>Tu peux tester toutes tes requêtes dans l'<a href="#atelier">atelier SQL</a> : il contient les tables Pays, Auteur, Livre, Ecrire et Personne.</p>`
  },
  {
    id: 'l5', title: 'SQL : WHERE et la sélection', skill: 'Filtrer les lignes avec une condition (comparaisons, NULL, LIKE)',
    lead: "La sélection ne garde que certaines lignes d'une table selon une condition booléenne : c'est la clause WHERE.",
    ex: ['l5-q1', 'l5-q2', 'l5-s1', 'l5-s2', 'l5-s3', 'l5-s4', 'l5-s5', 'l5-s6', 'l5-q3', 'l5-s7', 'l5-s8', 'l5-q4', 'l5-s9', 'l5-s10', 'l5-s11', 'l5-d1', 'l5-q5', 'l5-s12', 'l5-s13'],
    body: () => `
<h2>La sélection</h2>
<p>Exemple : les livres parus en 2020.</p>
${sqlb('SELECT *\nFROM Livre\nWHERE annéeParution = 2020')}
<p>La condition derrière <code>WHERE</code> est une expression booléenne : elle est évaluée pour chaque ligne, seules celles où elle est vraie sont conservées.</p>
<h3>Projection et sélection ensemble</h3>
<p>Les titres des livres parus en 2020, par ordre alphabétique :</p>
${sqlb('SELECT titre\nFROM Livre\nWHERE annéeParution = 2020\nORDER BY titre')}
<p>L'ordre des clauses est toujours : <code>SELECT</code>, <code>FROM</code>, <code>WHERE</code>, <code>ORDER BY</code>.</p>
<h2>Les constantes</h2>
${tbl(['Type', 'Exemples'], [['entiers', c('38') + ', ' + c('-45')], ['flottants', c('1.0') + ', ' + c('14.165') + ', ' + c('-8.217')], ['caractères', c("'A'") + ', ' + c("'c'")], ['chaînes', c("'bonjour'") + ', ' + c("'Zola'") + ', ' + c("'-8.5'") + ', ' + c("'aujourd''hui'")]])}
<p>Les chaînes sont entourées d'<strong>apostrophes simples</strong> (jamais de guillemets), et une apostrophe à l'intérieur se double. Pas de distinction majuscules/minuscules : <code>'Zola'</code>, <code>'zola'</code> et <code>'ZOLA'</code> sont égales.</p>
<h2>Les opérateurs arithmétiques</h2>
${tbl(['Opérateur', 'Rôle'], [[c('+') + ' ' + c('-'), 'addition, soustraction'], [c('*'), 'multiplication'], [c('/'), 'division : <strong>entière</strong> si les deux nombres sont entiers'], [c('%'), 'reste de la division entière']])}
<p>Pour obtenir un résultat flottant avec des entiers, il faut un flottant dans le calcul : <code>1.0 * 17 / 4</code> ou <code>17 / (1.0 * 4)</code>, mais pas <code>1.0 * (9 / 4)</code>.</p>
${sqlb('SELECT 17 / 4, 17 % 4, 1.0 * 17 / 4, 1.0 * (9 / 4)')}
<h2>Les opérateurs de comparaison</h2>
<p><code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code> <code>=</code> <code>!=</code> (ou <code>&lt;&gt;</code>) fonctionnent avec les entiers, flottants, caractères et chaînes. Pour des chaînes, c'est l'ordre alphabétique :</p>
${sqlb("SELECT nomPays\nFROM Pays\nWHERE (nomPays >= 'D') AND (nomPays < 'N')")}
${note('attention', 'Piège', `<p>Avec <code>nomPays &lt;= 'M'</code>, <code>'Malaisie'</code> serait exclu, car <code>'Malaisie' &gt; 'M'</code> (une chaîne plus longue qui commence pareil est plus grande). D'où le <code>&lt; 'N'</code>.</p>`)}
<h2>Les opérateurs booléens</h2>
<p><code>AND</code>, <code>OR</code>, <code>NOT</code> combinent les conditions. Les <strong>parenthèses</strong> évitent de se soucier des règles de priorité : <code>x &lt; 8 AND a + b = 0</code> se lit <code>(x &lt; 8) AND (a + b = 0)</code>.</p>
${sqlb("SELECT nom, prénom\nFROM Auteur\nWHERE (prénom = 'Victor' OR prénom = 'George') AND NOT (nom = 'Hugo')")}
<h2>Valeur non renseignée : NULL</h2>
<p>Un attribut sans valeur (non obligatoire) vaut <code>NULL</code>. Pour le tester, on utilise <code>IS NULL</code> ou <code>IS NOT NULL</code> :</p>
${sqlb('SELECT nom, prénom\nFROM Auteur\nWHERE prénom IS NULL')}
${note('attention', 'Piège', `<p><code>prénom = NULL</code> ne renvoie <strong>jamais</strong> de ligne : comparer à NULL donne « inconnu », pas « vrai ». Il faut écrire <code>IS NULL</code>. Pour la même raison, <code>prénom != 'Victor'</code> ne renvoie pas les lignes où le prénom est NULL.</p>${sqlb('SELECT nom, prénom\nFROM Auteur\nWHERE prénom = NULL')}`)}
<h2>Comparer des chaînes : LIKE</h2>
<p>Deux jokers : <code>%</code> remplace n'importe quelle suite de caractères (même vide), <code>_</code> remplace exactement un caractère.</p>
${tbl(['Motif', 'Signification'], [[c("nom LIKE 'V%'"), 'nom commençant par un V'], [c("nom LIKE '%ris%'"), "nom contenant « ris »"], [c("nom LIKE '%X'"), 'nom terminé par un X'], [c("nom LIKE '%A_'"), 'nom ayant un A en avant-dernière position']])}
<p>Teste des motifs sur une liste de noms :</p>
${likeLab()}
${sqlb("SELECT nom\nFROM Auteur\nWHERE nom LIKE 'D%'")}
<h2>Les dates</h2>
<p>Dans la table Personne, les dates sont au format année-mois-jour (<code>'1996-07-02'</code>) et se comparent comme du texte :</p>
${sqlb("SELECT nom, prénom, dateNaissance\nFROM Personne\nWHERE dateNaissance >= '1980-01-01' AND dateNaissance < '1990-01-01'\nORDER BY dateNaissance DESC")}
<p>Pour travailler par rapport à la date du jour, SQL Server propose les fonctions <code>GETDATE()</code> et <code>DATEDIFF</code>. Ici, <code>DATEDIFF(year, d1, d2)</code> donne l'écart d'années calendaires :</p>
${sqlb("SELECT nom, prénom, dateNaissance\nFROM Personne\nWHERE DATEDIFF(year, dateNaissance, GETDATE()) >= 20\nORDER BY dateNaissance DESC")}`
  },

    body: () => `
<h2>Représentation graphique d'une base</h2>
<p>Chaque table est un rectangle avec son nom et la liste de ses attributs (la clé est soulignée ou marquée par un symbole de clé). On omet généralement les domaines.</p>
${schemaFig(['Pays', 'Auteur'])}
<p>Les <strong>contraintes de référence</strong> indiquent comment « naviguer » d'une table à l'autre pour regrouper des informations éloignées : <code>Auteur.codePays référence Pays.codePays</code>. Elles disent quelle condition utiliser pour une jointure.</p>
<h3>La mini-base Bibliothèque</h3>
${schemaFig(['Pays', 'Auteur', 'Livre', 'Ecrire'])}
<ul class="refs"><li><code>Auteur.codePays</code> référence <code>Pays.codePays</code></li><li><code>Ecrire.cote</code> référence <code>Livre.cote</code></li><li><code>Ecrire.codeAuteur</code> référence <code>Auteur.codeAuteur</code></li></ul>
<h2>La jointure (un avant-goût)</h2>
<p>La <strong>jointure</strong> « met en commun » des informations de tables différentes. Nom, prénom et pays des auteurs :</p>
${sqlb('SELECT nom, prénom, nomPays\nFROM Auteur\n  INNER JOIN Pays ON Auteur.codePays = Pays.codePays')}
<p>La condition après <code>ON</code> vient directement de la contrainte de référence. Remarque : l'auteur sans pays (<code>codePays</code> NULL) n'apparaît pas dans le résultat. Nous verrons la jointure en détail plus tard.</p>
<p>Quand deux tables ont un attribut du même nom, il faut le préfixer : <code>Auteur.codePays</code>.</p>
<h2>La base NewClassique</h2>
<p>Pour la suite du semestre, la base de référence est <strong>NewClassique</strong> : des musiciens (environ 2000), des œuvres du répertoire classique (plus de 3000), des enregistrements (environ 15000), des albums (plus de 700). Elle compte 20 tables et a été créée automatiquement à partir d'informations collectées sur Internet : elle peut contenir certaines bizarreries. On y trouve :</p>
<ul><li>des œuvres, leurs types (sonate, symphonie…) et leurs compositeurs, avec leur nationalité ;</li><li>des compositions (« parties » d'une œuvre), des enregistrements (chacun concerne une unique composition) et leurs interprètes avec leur instrument ;</li><li>des chefs d'orchestre et les orchestres ;</li><li>des disques, des albums (avec leur genre : baroque, opéra…) et leurs éditeurs.</li></ul>

${tbl(['Étape', 'Détail'], [['Connexion au serveur', 'au lancement : serveur <code>info-mssql-etd</code>, et <strong>pas</strong> « Windows »'], ['Explorateur d\'objets', 'liste des bases hébergées (dont NewClassique) et de leurs tables, avec attributs et domaines'], ['Nouvelle requête', 'ouvre un nouvel onglet'], ['Exécuter', 'rédige la requête, exécute, le résultat s\'affiche en bas avec le nombre de lignes']])}
<p>L'<a href="#atelier">atelier SQL</a> de ce site reproduit ce principe sur les mini-bases du cours.</p>`

/* ---------- Exécution SQL et affichage ---------- */
function resHTML(r, o) {
  o = o || {};
  const head = r.cols.map(c => `<th scope="col">${esc(c)}</th>`).join('');
  const shown = r.rows.slice(0, o.max || 200);
  const body = shown.map(row => `<tr>${row.map(v => v === null ? '<td class="null">NULL</td>' : `<td${typeof v === 'number' ? ' class="num"' : ''}>${esc(SQLE.fmt(v))}</td>`).join('')}</tr>`).join('');
  const more = r.rows.length > shown.length ? `<p class="res-more">… ${r.rows.length - shown.length} lignes de plus non affichées.</p>` : '';
  return `<div class="tbl-wrap res-wrap"><table class="res"><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${r.cols.length}" class="empty">(aucune ligne)</td></tr>`}</tbody></table></div>${more}<p class="res-count">${r.rows.length} ligne${r.rows.length > 1 ? 's' : ''}</p>`;
}
function execSql(src) {
  try { const r = SQLE.run(DB, src); return { ok: true, res: r, html: resHTML(r) }; }
  catch (e) {
    if (e instanceof SQLE.SqlError) return { ok: false, html: `<p class="sql-err" role="alert"><strong>Erreur.</strong> ${esc(e.message)}</p>` };
    return { ok: false, html: `<p class="sql-err" role="alert"><strong>Erreur.</strong> La requête n'a pas pu être exécutée.</p>` };
  }
}

  <div class="corr" hidden><p><strong>Une correction possible :</strong></p><div class="corr-b">${def.corr}</div><div class="ex-actions"><button type="button" class="btn" data-act="d-ok">J'avais l'essentiel ✓</button></div><p class="note-line">Plusieurs solutions peuvent être valables : compare surtout les clés primaires, les clés étrangères et les contraintes.</p></div></section>`;
  }
  if (def.type === 'drill') return `<section class="ex ex-drill${done ? ' is-done' : ''}" data-ex="${id}" data-kind="${def.kind}" data-need="${def.need}">${head('Entraînement')}<div class="drill-host"></div></section>`;
  return '';
}
function markDone(id) {
  if (!Store.data.done[id]) { Store.data.done[id] = 1; Store.save(); }
  const sec = $(`[data-ex="${id}"]`);
  if (sec) { sec.classList.add('is-done'); const b = $('.ex-badge', sec); if (b) b.hidden = false; }
  window.updateProgress();
}
function setFb(sec, text, cls) { const fb = $('.ex-fb', sec); if (fb) { fb.textContent = text; fb.className = 'ex-fb ' + (cls || ''); } }

/* ---------- Entraînement LIKE ---------- */
const WORDS = ['Victor', 'Hugo', 'Zola', 'Dumas', 'Colette', 'Orwell', 'Murakami', 'Baudelaire', 'Tolstoï', 'Wilde', 'Ernaux', 'Sand', 'Eco', 'Segalen', 'Alexandre', 'Marie', 'Annie'];
const PATS = ["V%", "%a", "%ris%", "%X", "_o%", "%e", "%A_", "D%", "%l%l%", "_a%", "S___", "%ie", "%o_", "E%o"];
const DRILLS = {
  like() {
    const w = pick(WORDS), p = pick(PATS), truth = SQLE.like(w, p);
    return { q: `<code>'${esc(w)}' LIKE '${esc(p)}'</code> : la condition est-elle vraie ?`, bool: true, ok: v => (v === 'vrai') === truth, show: truth ? 'Oui' : 'Non', why: '% = n\'importe quelle suite de caractères (même vide), _ = exactement un caractère. La casse est ignorée.' };
  }
};
function mountDrill(host, kind, need, onDone, title) {
  let streak = 0, cur = null, answered = false;
  const render = () => {
    cur = DRILLS[kind](); answered = false;
    host.innerHTML = `${title ? `<h4 class="ex-title">${esc(title)}</h4>` : ''}<p class="ex-q">${cur.q}</p>
    <div class="bool-btns" role="group"><button type="button" class="choice" data-d="vrai"><span class="mark"></span>Vrai</button><button type="button" class="choice" data-d="faux"><span class="mark"></span>Faux</button></div>
    <p class="ex-fb" role="status"></p><p class="streak" aria-live="polite">Série : <strong>${streak}</strong> / ${need}</p>`;
  };
  const answer = v => {
    if (answered) return; answered = true;
    const ok = cur.ok(v); streak = ok ? streak + 1 : 0;
    const fb = $('.ex-fb', host); fb.className = 'ex-fb ' + (ok ? 'ok' : 'ko');
    fb.textContent = ok ? 'Juste !' : `Pas tout à fait : ${cur.show}. ${cur.why}`;
    $('.streak', host).innerHTML = `Série : <strong>${streak}</strong> / ${need}`;
    if (streak >= need) { fb.textContent = 'Série complète, bravo !'; if (onDone) onDone(); }
    const nxt = document.createElement('button'); nxt.type = 'button'; nxt.className = 'btn ghost'; nxt.textContent = 'Question suivante'; nxt.onclick = render; fb.after(nxt); nxt.focus();
    $$('.choice', host).forEach(x => { x.disabled = true; });
  };
  host.addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) answer(b.dataset.d); });
  render();
}

/* ---------- Laboratoire LIKE ---------- */
function mountLikeLab(host) {
  const names = ['Victor', 'Hugo', 'Zola', 'Dumas', 'Colette', 'Orwell', 'Murakami', 'Baudelaire', 'Voltaire', 'Moreau', 'Eco', 'Sand', 'Ernaux', 'Segalen', 'Wilde', 'Tolstoï'];
  host.innerHTML = `<h4 class="ex-title">Laboratoire LIKE</h4><label class="lab-l" for="like-in">Motif :</label>
  <input id="like-in" class="drill-in" type="text" value="%ris%" spellcheck="false" autocomplete="off" autocapitalize="off">
  <p class="lab-q"><code>nom LIKE '<span class="lab-pat"></span>'</code></p><ul class="names"></ul><p class="res-count lab-n"></p>
  <p class="note-line">Essaie : <button type="button" class="chip" data-p="V%">V%</button> <button type="button" class="chip" data-p="%e">%e</button> <button type="button" class="chip" data-p="_o%">_o%</button> <button type="button" class="chip" data-p="%o_">%o_</button></p>`;
  const inp = $('input', host);
  const upd = () => {
    const p = inp.value; $('.lab-pat', host).textContent = p;
    let n = 0;
    $('.names', host).innerHTML = names.map(w => { const m = SQLE.like(w, p); if (m) n++; return `<li class="${m ? 'yes' : 'no'}">${esc(w)}<span class="sr-only">${m ? ' : correspond' : ' : ne correspond pas'}</span></li>`; }).join('');
    $('.lab-n', host).textContent = `${n} nom${n > 1 ? 's' : ''} sur ${names.length} correspondent`;
  };
  inp.addEventListener('input', upd);
  host.addEventListener('click', e => { const c = e.target.closest('[data-p]'); if (c) { inp.value = c.dataset.p; upd(); } });
  upd();
}

function mountWidgets(root) {
  $$('[data-widget]', root).forEach(w => {
    if (w.dataset.widget === 'likelab') mountLikeLab(w);
    else if (w.dataset.widget === 'drill') mountDrill(w, w.dataset.kind, 99, null, w.dataset.title);
  });
  $$('.ex-drill', root).forEach(sec => mountDrill($('.drill-host', sec), sec.dataset.kind, +sec.dataset.need, () => markDone(sec.dataset.ex)));
  $$('.ex .sql-ta', root).forEach(ta => {
    ta.addEventListener('input', () => { const id = ta.closest('.ex').dataset.ex; Store.data.notes[id] = ta.value; Store.save(); });
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const b = $('[data-act="sql-check"]', ta.closest('.ex')); if (b) b.click(); } });
  });
}

/* ---------- Pages ---------- */
function progress() {
  const done = EX_IDS.filter(id => Store.data.done[id]).length;
  return { done, total: EX_IDS.length, lessons: LESSONS.filter(l => Store.data.lessons[l.id]).length, nl: LESSONS.length };
}
function homeSummary() {
  const p = progress(), nx = LESSONS.find(l => !Store.data.lessons[l.id]);
  return `<p class="sum-line"><strong>${p.lessons}</strong> leçon${p.lessons > 1 ? 's' : ''} sur ${p.nl} terminée${p.lessons > 1 ? 's' : ''} · <strong>${p.done}</strong> exercice${p.done > 1 ? 's' : ''} réussi${p.done > 1 ? 's' : ''} sur ${p.total}</p>` +
    (nx ? `<a class="btn" href="#${nx.id}">${p.done || p.lessons ? 'Continuer' : 'Commencer'} : ${esc(nx.title)}</a>` : '<p class="sum-line">Tout est fait. L\'atelier et le mémo sont là pour t\'entraîner librement.</p>');
}
window.updateProgress = function () {
  const p = progress(), pct = Math.round(100 * p.done / p.total);
  const bar = $('#prog-bar'), txt = $('#prog-txt');
  if (bar) { bar.style.width = pct + '%'; bar.parentElement.setAttribute('aria-valuenow', String(pct)); }
  if (txt) txt.textContent = `${p.done}/${p.total} exercices`;
  $$('.nav a').forEach(a => a.classList.toggle('is-done', !!Store.data.lessons[a.dataset.id]));
  $$('.skill[data-l]').forEach(s => s.classList.toggle('is-done', !!Store.data.lessons[s.dataset.l]));
  const sum = $('#home-sum'); if (sum) sum.innerHTML = homeSummary();
};
const navHTML = () => NAV.map(g => `<div class="nav-g"><div class="nav-h">${g.group}</div>${g.items.map(i => `<a href="#${i.id}" data-id="${i.id}"><span class="nav-n">${i.n}</span><span class="nav-t">${esc(i.label)}</span></a>`).join('')}</div>`).join('');

function pageAccueil() {
  return `<div class="home">
  <section class="hero"><p class="kicker">R1.05 · Bases de données et SQL</p>
  <h1>Comprendre les bases de données, et leur poser des questions en SQL.</h1>
  <p class="lead">Du modèle relationnel (tables, clés, contraintes) aux premières requêtes <code>SELECT</code> : projection, tri, <code>DISTINCT</code>, sélection avec <code>WHERE</code>, <code>NULL</code> et <code>LIKE</code>. Chaque requête s'exécute vraiment, sur des tables fournies, et tes réponses sont corrigées automatiquement.</p>
  <div id="home-sum" class="home-sum">${homeSummary()}</div></section>
  ${anatomy()}
  <h2>Ce que tu sauras faire</h2><p>Chaque compétence se coche quand tu termines la leçon.</p>
  <ul class="skills">${LESSONS.map((l, i) => `<li class="skill${Store.data.lessons[l.id] ? ' is-done' : ''}" data-l="${l.id}"><a href="#${l.id}"><span class="sk-n">${i + 1}</span><span class="sk-t">${esc(l.skill)}</span><span class="sk-l">${esc(l.title)}</span></a></li>`).join('')}</ul>
  <p><a class="btn ghost" href="#atelier">Ouvrir l'atelier SQL</a> <a class="btn ghost" href="#memo">Voir le mémo</a></p></div>`;
}
function pageLesson(l, idx) {
  const done = !!Store.data.lessons[l.id], prev = ORDER[idx - 1], next = ORDER[idx + 1];
  const t = id => LESSONS.find(x => x.id === id).title;
  const hasSql = l.ex.some(e => EX[e].type === 'sql');
  return `<article class="page"><p class="kicker">Leçon ${idx + 1} sur ${LESSONS.length}</p><h1>${esc(l.title)}</h1><p class="lead">${esc(l.lead)}</p>
  <div class="body">${l.body()}</div>
  <section class="practice"><h2>S'entraîner</h2>
  ${hasSql ? `<details class="tables-d"><summary>Voir les tables disponibles</summary>${schemaFig(['Pays', 'Auteur', 'Livre', 'Ecrire', 'Personne'])}<ul class="refs">${REFS.map(r => `<li><code>${esc(r)}</code></li>`).join('')}</ul></details>` : ''}
  ${l.ex.map(exercise).join('')}</section>
  <div class="finish"><button type="button" class="btn${done ? ' ghost' : ''}" data-app="finish" data-l="${l.id}" aria-pressed="${done}">${done ? '✓ Leçon terminée' : 'Marquer la leçon comme terminée'}</button></div>
  <nav class="pager" aria-label="Navigation">${prev ? `<a href="#${prev}"><span>Précédent</span>${esc(t(prev))}</a>` : '<span></span>'}${next ? `<a class="next" href="#${next}"><span>Suivant</span>${esc(t(next))}</a>` : '<a class="next" href="#memo"><span>Pour finir</span>Mémo</a>'}</nav></article>`;
}
function pageMemo() {
  return `<article class="page"><p class="kicker">Aide-mémoire</p><h1>Mémo</h1><p class="lead">Tout le cours sur une page.</p>
  <h2>La requête d'interrogation</h2>${anatomy()}
  ${tbl(['Clause', 'Rôle', 'Exemple'], MEMO.clauses.map(r => [c(r[0]), esc(r[1]), c(r[2])]))}
  <h2>Opérateurs</h2>${tbl(['Opérateur', 'Rôle'], MEMO.ops.map(r => [c(r[0]), esc(r[1])]))}
  <h2>Constantes</h2>${tbl(['Type', 'Exemple'], [['entier', c('38')], ['flottant', c('14.165')], ['chaîne', c("'Zola'  'aujourd''hui'")], ['date', c("'1996-07-02'")]])}
  <h2>Vocabulaire du modèle relationnel</h2>${tbl(['Mot courant', 'Terme du cours'], MEMO.vocab.map(r => [esc(r[0]), esc(r[1])]))}
  <h2>Contraintes d'intégrité</h2>${tbl(['Contrainte', 'Notation'], [['référence', c('Auteur.codePays référence Pays.codePays')], ['attribut obligatoire', c('Tous les attributs, sauf prénom, sont obligatoires')], ['unicité', c('Unicité de Pays.nomPays')]])}
  <h2>Messages d'erreur fréquents</h2>${tbl(['Message', 'Cause probable'], MEMO.errors.map(r => [c(r[0]), esc(r[1])]))}</article>`;
}
const EXAMPLES = {
  'Tous les pays': 'SELECT *\nFROM Pays',
  'Noms triés': 'SELECT nom, prénom\nFROM Auteur\nORDER BY nom, prénom DESC',
  'Prénoms distincts': 'SELECT DISTINCT prénom\nFROM Auteur',
  'Livres de 2020': 'SELECT titre\nFROM Livre\nWHERE annéeParution = 2020\nORDER BY titre',
  'LIKE': "SELECT nom\nFROM Auteur\nWHERE nom LIKE '%ar%'",
  'Valeurs NULL': 'SELECT nom, prénom\nFROM Auteur\nWHERE prénom IS NULL',
  'Jointure': 'SELECT nom, prénom, nomPays\nFROM Auteur\n  INNER JOIN Pays ON Auteur.codePays = Pays.codePays'
};
function pageAtelier() {
  return `<article class="page wide"><p class="kicker">Outil</p><h1>Atelier SQL</h1>
  <p class="lead">Écris une requête SELECT, exécute-la (Ctrl + Entrée) et regarde le résultat. Clique sur une table pour voir son contenu.</p>
  <div class="at-bar"><label>Exemple <select id="at-sel">${Object.keys(EXAMPLES).map(n => `<option>${esc(n)}</option>`).join('')}</select></label></div>
  <label class="sr-only" for="at-ta">Requête SQL</label>
  <textarea id="at-ta" class="sql-ta big" rows="6" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <div class="ex-actions"><button type="button" class="btn" data-app="at-run">▶ Exécuter</button><button type="button" class="btn ghost" data-app="at-reset">Exemple d'origine</button></div>
  <div id="at-res" class="sql-res" aria-live="polite"></div>
  <h2>Les tables</h2><p>Un clic remplit l'éditeur avec <code>SELECT * FROM …</code>.</p>
  <div class="chips">${DB.tables.map(t => `<button type="button" class="chip" data-app="at-tbl" data-t="${t.name}">${t.name} <small>${t.rows.length}</small></button>`).join('')}</div>
  ${schemaFig(DB.tables.map(t => t.name))}<ul class="refs">${REFS.map(r => `<li><code>${esc(r)}</code></li>`).join('')}</ul></article>`;
}
function mountAtelier() {
  const ta = $('#at-ta'), sel = $('#at-sel');
  const pend = window.pendingSql; window.pendingSql = null;
  ta.value = pend != null ? pend : (Store.data.atelier || EXAMPLES[sel.value]);
  ta.addEventListener('input', () => { Store.data.atelier = ta.value; Store.save(); });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runAtelier(); } });
  sel.addEventListener('change', () => { ta.value = EXAMPLES[sel.value]; ta.dispatchEvent(new Event('input')); });
  if (pend != null) runAtelier();
}
function runAtelier() { const r = execSql($('#at-ta').value); $('#at-res').innerHTML = r.html; }

/* ---------- Routage ---------- */
function route() {
  let id = (location.hash || '').replace('#', '');
  if (!ALL_IDS.includes(id)) id = 'accueil';
  const li = LESSONS.findIndex(l => l.id === id);
  let html;
  if (id === 'accueil') html = pageAccueil(); else if (li >= 0) html = pageLesson(LESSONS[li], li); else if (id === 'atelier') html = pageAtelier(); else html = pageMemo();
  const m = main(); m.innerHTML = html;
  $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === id ? 'page' : 'false'));
  document.title = id === 'accueil' ? 'SQL R1.05' : ((li >= 0 ? LESSONS[li].title : id === 'atelier' ? 'Atelier SQL' : 'Mémo') + ' · SQL R1.05');
  mountWidgets(m);
  if (id === 'atelier') mountAtelier();
  window.updateProgress(); closeDrawer(); window.scrollTo(0, 0); m.focus({ preventScroll: true });
}
function closeDrawer() { document.body.classList.remove('drawer-open'); const b = $('#menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }
function setTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

function act(b) {
  const k = b.dataset.act, sec = b.closest('.ex');
  if (k === 'sql-run') { const fig = b.closest('.cb'); $('.sql-res', fig).innerHTML = execSql(fig.dataset.sql).html; }
  else if (k === 'sql-open') { window.pendingSql = b.closest('.cb').dataset.sql; location.hash = '#atelier'; }
  else if (k === 'qcm') {
    if (sec.classList.contains('is-done') && $('.choice.ok', sec)) return;
    const def = EX[sec.dataset.ex], i = +b.dataset.i;
    if (i === def.answer) { b.classList.add('ok'); $$('.choice', sec).forEach(x => { x.disabled = true; }); setFb(sec, 'Exact. ' + def.why, 'ok'); markDone(sec.dataset.ex); }
    else { b.classList.add('ko'); b.disabled = true; setFb(sec, "Ce n'est pas celle-là. Relis le cours et essaie une autre réponse.", 'ko'); }
  } else if (k === 'sql-try' || k === 'sql-check') {
    const id = sec.dataset.ex, def = EX[id], src = $('.sql-ta', sec).value;
    if (!src.trim()) { setFb(sec, 'Écris ta requête dans la zone ci-dessus.', 'ko'); return; }
    const r = execSql(src); $('.sql-res', sec).innerHTML = r.html;
    if (!r.ok) { setFb(sec, 'Ta requête contient une erreur : lis le message ci-dessus.', 'ko'); return; }
    if (k === 'sql-try') { setFb(sec, '', ''); return; }
    const exp = SQLE.run(DB, def.ref);
    const [ok, msg] = SQLE.compare(r.res, exp, exp.ordered);
    setFb(sec, ok ? 'Réussi. ' + msg : msg, ok ? 'ok' : 'ko');
    if (ok) markDone(id);
  } else if (k === 'sql-hint') $('.hint', sec).hidden = false;
  else if (k === 'sql-sol') $('.sol', sec).hidden = false;
  else if (k === 'd-show') { $('.corr', sec).hidden = false; b.hidden = true; }
  else if (k === 'd-ok') { markDone(sec.dataset.ex); b.disabled = true; b.textContent = '✓ Noté'; }
}
function init() {
  document.getElementById('app').innerHTML = `
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu" aria-expanded="false" aria-controls="side">☰</button>
  <a class="brand" href="#accueil"><span class="brand-mark">SQL</span>R1.05</a>
  <div class="meter" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="prog-bar"></i></div>
  <span id="prog-txt" class="prog-txt"></span>
  <div class="tools"><button type="button" id="theme-btn" class="icon-btn" aria-label="Changer le thème" title="Thème clair / sombre">◐</button></div>
</header>
<div class="shell"><nav id="side" class="side nav" aria-label="Sommaire">${navHTML()}</nav><div class="scrim" data-app="scrim"></div><main id="main" tabindex="-1"></main></div>`;
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (a) act(a);
    const b = e.target.closest('[data-app]'); if (!b) return;
    const k = b.dataset.app;
    if (k === 'finish') {
      const id = b.dataset.l; Store.data.lessons[id] = !Store.data.lessons[id]; Store.save();
      const on = !!Store.data.lessons[id];
      b.textContent = on ? '✓ Leçon terminée' : 'Marquer la leçon comme terminée'; b.classList.toggle('ghost', on); b.setAttribute('aria-pressed', String(on)); window.updateProgress();
    } else if (k === 'scrim') closeDrawer();
    else if (k === 'at-run') runAtelier();
    else if (k === 'at-reset') { const ta = $('#at-ta'); ta.value = EXAMPLES[$('#at-sel').value]; ta.dispatchEvent(new Event('input')); }
    else if (k === 'at-tbl') { const ta = $('#at-ta'); ta.value = 'SELECT *\nFROM ' + b.dataset.t; ta.dispatchEvent(new Event('input')); runAtelier(); }
  });
  $('#menu-btn').addEventListener('click', () => { const o = document.body.classList.toggle('drawer-open'); $('#menu-btn').setAttribute('aria-expanded', String(o)); });
  $('#theme-btn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    setTheme(dark ? 'light' : 'dark');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  window.addEventListener('hashchange', route);
  route();
}
init();

</script>

</body></html>
